# Docker Compose для Telegram VPN бота

services:
  bot:
    build:
      context: .
      args:
        - HTTP_PROXY=http://127.0.0.1:10809
        - HTTPS_PROXY=http://127.0.0.1:10809
        - http_proxy=http://127.0.0.1:10809
        - https_proxy=http://127.0.0.1:10809
    container_name: telegram-vpn-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтирование базы данных напрямую из папки проекта
      - ./data:/app/data
      # Логи (опционально)
      - ./logs:/app/logs
      # Монтирование .env файла с секретами
      - ./bot.env:/app/.env:ro
    environment:
      - DB_PATH=/app/data/tg_key_bot.db
      - PYTHONUNBUFFERED=1
      # Прокси для runtime (если нужен доступ к внешним API)
      - HTTP_PROXY=http://host.docker.internal:10809
      - HTTPS_PROXY=http://host.docker.internal:10809
      - NO_PROXY=localhost,127.0.0.1,deb.debian.org,security.debian.org
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8123:8123"  # Django админка
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
