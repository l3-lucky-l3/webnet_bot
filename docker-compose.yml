# Docker Compose для Telegram VPN бота
version: '3.8'

services:
  bot:
    build: .
    container_name: telegram-vpn-bot
    restart: unless-stopped
    volumes:
      # Сохранение базы данных вне контейнера
      - bot_data:/app/data
      # Логи (опционально)
      - bot_logs:/app/logs
      # Монтирование .env файла с секретами
      - ./bot.env:/app/.env:ro
    environment:
      - DB_PATH=/app/data/tg_key_bot.db
      - PYTHONUNBUFFERED=1
    ports:
      - "8123:8123"  # Django админка
    networks:
      - bot_network

volumes:
  bot_data:
    name: telegram-bot-data
  bot_logs:
    name: telegram-bot-logs

networks:
  bot_network:
    driver: bridge
