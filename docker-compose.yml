# Docker Compose для Telegram VPN бота

services:
  bot:
    build: .
    container_name: telegram-vpn-bot
    restart: unless-stopped
    volumes:
      # Монтирование базы данных напрямую из папки проекта
      - ./data:/app/data
      # Логи (опционально)
      - ./logs:/app/logs
      # Монтирование .env файла с секретами
      - ./bot.env:/app/.env:ro
    environment:
      - DB_PATH=/app/data/tg_key_bot.db
      - PYTHONUNBUFFERED=1
    ports:
      - "8123:8123"  # Django админка
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
