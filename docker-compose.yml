# Docker Compose для Telegram VPN бота
services:
  # 1. Сервис для применения миграций (запускается первым и умирает)
  migrate:
    build: .
    command: python manage.py migrate --noinput
    volumes:
      - .:/app
      - ./data:/app/data
    networks:
      - bot_network

  # 2. Основной сервис бота
  telegram-vpn-bot:
    build: .
    container_name: telegram-vpn-bot
    restart: unless-stopped
    command: python run_bot_with_django.py
    ports:
      - "8123:8123"
      - "8023:8023"
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge