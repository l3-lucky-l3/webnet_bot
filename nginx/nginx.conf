events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream для нашего бота (Django + Webhook)
    upstream bot_backend {
        server telegram-vpn-bot:8123; # Django
    }
    
    upstream webhook_backend {
        server telegram-vpn-bot:8024; # Webhook сервер
    }

    server {
        listen 80;
        server_name 188.215.229.165; # Или ваш домен, если есть

        # --- Webhooks (Platega/Antilopay) ---
        # Важно: платежные системы часто стучатся напрямую по IP или домену
        location /webhook {
            proxy_pass http://webhook_backend/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Увеличиваем таймауты для долгих обработок
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Django Admin & API ---
        location / {
            proxy_pass http://bot_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Health Check ---
        location /health {
            proxy_pass http://webhook_backend/health;
        }
    }
}
