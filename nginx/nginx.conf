events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream для нашего бота (Django + Webhook)
    # Используем имя контейнера Docker и порт Django (8123)
    upstream bot_backend {
        server telegram-vpn-bot:8123;
    }

    server {
        listen 80;
        server_name webnet.panel-fran-patriot.com.de;

        # --- Webhooks (Platega/Antilopay/CryptoBot и др.) ---
        # Все webhook запросы направляются на Django приложение
        location /webhook {
            proxy_pass http://bot_backend/bot_management/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Увеличиваем таймауты для долгих обработок
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Django Admin & API ---
        location / {
            proxy_pass http://bot_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Health Check ---
        location /health {
            proxy_pass http://bot_backend/bot_management/api/health/;
        }

        # SSL configuration (added by certbot)
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/webnet.panel-fran-patriot.com.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/webnet.panel-fran-patriot.com.de/privkey.pem;
        include /etc/nginx/ssl/options-ssl-nginx.conf;
        ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;
    }

    # Redirect HTTP to HTTPS
    server {
        if ($host = webnet.panel-fran-patriot.com.de) {
            return 301 https://$host$request_uri;
        }

        listen 80;
        server_name webnet.panel-fran-patriot.com.de;
        return 404;
    }
}
