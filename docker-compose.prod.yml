services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webnet_migrate_prod
    command: python manage.py migrate --noinput
    volumes:
      - .:/app
      - ./data:/app/data
      - ./tg_key_bot.db:/app/tg_key_bot.db
    networks:
      - webnet_network_prod
    environment:
      - DJANGO_SETTINGS_MODULE=tg_bot_admin.settings
      - DEBUG=False

  telegram-vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webnet_bot_prod
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - SUPPORT_GROUP_ID=${SUPPORT_GROUP_ID}
      - PLATEGA_API_KEY=${PLATEGA_API_KEY}
      - PLATEGA_SHOP_ID=${PLATEGA_SHOP_ID}
      - ANTILOPAY_PUBLIC_KEY=${ANTILOPAY_PUBLIC_KEY}
      - ANTILOPAY_SECRET_KEY=${ANTILOPAY_SECRET_KEY}
      - REMNAWAVE_API_URL=${REMNAWAVE_API_URL}
      - REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8023
      - DJANGO_SETTINGS_MODULE=tg_bot_admin.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
    ports:
      - "8123:8123"
      - "8023:8023"
    expose:
      - "8023"
      - "8123"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./tg_key_bot.db:/app/tg_key_bot.db
      - ./images:/app/images
      - ./bot_security.log:/app/bot_security.log
    networks:
      - webnet_network_prod
    command: >
      sh -c "python run_bot_with_django.py"

  nginx:
    image: nginx:alpine
    container_name: webnet_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro   # ← ВСЯ папка
    depends_on:
      - telegram-vpn-bot
    networks:
      - webnet_network_prod

networks:
  webnet_network_prod:
    driver: bridge