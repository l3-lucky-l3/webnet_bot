version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: webnet_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-webnet}
      POSTGRES_USER: ${DB_USER:-webnet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webnet_pass}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - webnet_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webnet_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  telegram-vpn-bot:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webnet_bot_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-webnet}
      - DB_USER=${DB_USER:-webnet_user}
      - DB_PASSWORD=${DB_PASSWORD:-webnet_pass}
      - DB_PORT=5432
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - SUPPORT_GROUP_ID=${SUPPORT_GROUP_ID}
      - PLATEGA_API_KEY=${PLATEGA_API_KEY}
      - PLATEGA_SHOP_ID=${PLATEGA_SHOP_ID}
      - ANTILOPAY_PUBLIC_KEY=${ANTILOPAY_PUBLIC_KEY}
      - ANTILOPAY_SECRET_KEY=${ANTILOPAY_SECRET_KEY}
      - REMNAWAVE_API_URL=${REMNAWAVE_API_URL}
      - REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8024
      - DJANGO_SETTINGS_MODULE=tg_bot_admin.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
    expose:
      - "8024" # Вебхуки (внутренний порт)
      - "8123" # Django (внутренний порт)
    networks:
      - webnet_network_prod
    command: >
      sh -c "python manage.py migrate &&
             python run_bot_with_django.py"

  nginx:
    image: nginx:alpine
    container_name: webnet_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - telegram-vpn-bot
    networks:
      - webnet_network_prod

volumes:
  pgdata_prod:

networks:
  webnet_network_prod:
    driver: bridge
