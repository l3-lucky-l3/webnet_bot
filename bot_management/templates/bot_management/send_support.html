{% extends 'bot_management/base.html' %}

{% block title %}Отправка сообщения поддержки{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Отправка сообщения поддержки</h6>
                </div>
                <div class="card-body">
                    <form id="supportForm">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="chat_id">ID чата:</label>
                            <input type="number" class="form-control" id="chat_id" name="chat_id" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Сообщение:</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                    
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('supportForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const resultDiv = document.getElementById('result');
    
    // Показываем загрузку
    resultDiv.innerHTML = '<div class="alert alert-info">Отправка...</div>';
    
    // Отправляем запрос
    fetch('{% url "bot_management:test_support_simple" %}', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            resultDiv.innerHTML = '<div class="alert alert-success">✅ ' + data.message + '</div>';
        } else {
            resultDiv.innerHTML = '<div class="alert alert-danger">❌ ' + data.message + '</div>';
        }
    })
    .catch(error => {
        resultDiv.innerHTML = '<div class="alert alert-danger">❌ Ошибка: ' + error + '</div>';
    });
});
</script>
{% endblock %}
